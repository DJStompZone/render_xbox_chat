<div class="flex flex-wrap items-center justify-between gap-3 mt-6">

                    Prev
                </button>
                <button id="nextBtn" class="px-4 py-2 bg-gray-700 text-white rounded disabled:opacity-30">
                    Next
                </button>
            </div>
            <div class="flex items-center gap-2">
                <span id="pageInfo" class="text-sm text-gray-700"></span>
                <input id="jumpInput" type="number" min="1" class="w-16 p-1 border rounded text-sm"
                    placeholder="Page" />
                <button id="jumpBtn" class="px-3 py-1 bg-gray-700 text-white rounded text-sm">
                    Jump
                </button>
            </div>
        </div>
