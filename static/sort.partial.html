<div class="mb-4 flex flex-wrap items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold">Order:</span>
                <button id="sortAscBtn" class="px-3 py-1 text-sm rounded bg-gray-800 text-white">
                    Oldest → Newest
                </button>
                <button id="sortDescBtn" class="px-3 py-1 text-sm rounded bg-gray-300 text-gray-800">
                    Newest → Oldest
                </button>
            </div>

            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold">Page size:</span>
                <input id="pageSizeInput" type="number" min="10" max="1000" value="100"
                    class="w-20 p-1 border rounded text-sm" />
            </div>
        </div>
