[project]
name = "renderxboxchat"
version = "0.2.0"
description = "Fetch one or more Xbox Live chat conversations and render them to static HTML."
authors = [
    {name = "DJ Stomp",email = "85457381+DJStompZone@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "xbl3auth (>=0.1.0,<0.2.0)",
    "requests (>=2.31.0,<3.0.0)",
    "tqdm (>=4.66.0,<5.0.0)"
]

[project.optional-dependencies]
dev = [
    "pytest (>=7.4.0,<9.0.0)",
    "pytest-cov (>=4.1.0,<6.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
